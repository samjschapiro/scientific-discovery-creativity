output_dir: data/shaky_foundations/taxonomy_figures_v1
factors_dir: data/shaky_foundations/factors_v3
measures_path: data/shaky_foundations/measures_v2/measures.parquet
extra_measures_paths: [data/shaky_foundations/prescience_v1/prescience.parquet]

# Names follow the blind-variation / selective-retention reading (report: 2026-11-21_creativity_taxonomy_bvsr).
factor_names: ["F1 | Selection", "F2 | Variation", "F3 | Retention", "F4 | Embeddedness"]
measure_labels:
  novel_pair_adoption: "New pairs later adopted"
  emergence: "Emergence (concept growth)"
  prescience: "Prescience"
  dsi: "Divergent semantic integration"
  novel_pair_frac: "New concept pairs (surprise)"
  log_citers5: "Citations (5 y)"
  fang_f: "Foundation share"
  cd: "Disruption (CD5)"
  fang_g: "Generalization share"
  log_refs: "References"
measure_order: [novel_pair_adoption, emergence, prescience, dsi, novel_pair_frac, log_citers5, fang_f, cd, fang_g, log_refs]

landmarks:   # offset = label position in points relative to the dot (Figure 2)

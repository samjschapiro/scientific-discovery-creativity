  - {title: "Adam: A Method for Stochastic Optimization", label: "Adam"}
  - {title: "Auto-Encoding Variational Bayes", label: "VAE", offset: [5, 4]}
  - {title: "Batch Normalization: Accelerating Deep Network Training by Reducing Internal Covariate Shift", label: "BatchNorm", offset: [-6, -8]}
  - {title: "Semi-Supervised Classification with Graph Convolutional Networks", label: "GCN", offset: [-4, -9]}
  - {title: "Distributed Representations of Words and Phrases and their Compositionality", label: "word2vec", offset: [6, 0]}
  - {title: "Sequence to Sequence Learning with Neural Networks", label: "seq2seq", offset: [6, 0]}
  - {title: "Neural Machine Translation by Jointly Learning to Align and Translate", label: "Bahdanau attention", offset: [-4, 9]}
  - {title: "Very Deep Convolutional Networks for Large-Scale Image Recognition", label: "VGG", offset: [-6, -8]}
  - {title: "Faster R-CNN: Towards Real-Time Object Detection with Region Proposal Networks", label: "Faster R-CNN", offset: [2, 10]}
  - {title: "U-Net: Convolutional Networks for Biomedical Image Segmentation", label: "U-Net"}
  - {title: "GloVe: Global Vectors for Word Representation", label: "GloVe", offset: [-6, -7]}

output_dir: data/shaky_foundations/ideagen_build_v1

lacuna_dir: data/lacuna-recombination-2026-11-06-v2
lacuna_package: lacuna-recombination-2026-11-06-v2
targets_path: configs/shaky_foundations/ideagen_targets.yaml
hits_path: data/shaky_foundations/scale_foundations_v2/hits.parquet   # critique attributions (proxy), top-500 foundations

n_examples: 6            # critiques and prior attempts shown on each briefing card
n_distractors: 400       # random post-T citers of the foundation in each candidate pool
n_prior_papers: 400      # pre-T citers whose mechanisms define "already in the literature"
n_negative: 5            # random unrelated mechanism atoms per target (negative control)
n_hard: 60               # hard negatives: post-T papers raising the same limitation, not labelled fixes
remove_limitation_direction: true   # project the limitation's embedding out before scoring
seed: 0

embedding: {model: BAAI/bge-large-en-v1.5, device: mps, cache_dir: data/shaky_foundations/atom_vectors}
